# Drone CI pipeline: install -> API tests -> E2E tests -> one combined Teams notification.
#
# `api-tests` and `e2e-tests` each write their own JSON report (see playwright.config.ts /
# TEST_REPORT_NAME); `notify-teams` runs last, reads both, and posts exactly one Adaptive
# Card summary regardless of whether the run passed or failed.
#
# Both steps point at a real, already-running Keycloak/test environment via secrets — this
# pipeline does not spin up the repo's docker-compose Keycloak + sample-app (those are for
# local development of the framework itself; see README.md / docs/CI.md). api-tests needs
# Keycloak too, not just e2e-tests: every controller authenticates via a real Keycloak
# session before its first call (see docs/AUTH.md) — there's no unauthenticated API path.
#
# Required secrets (drone secrets add / from your Drone org settings):
#   e2e_base_url, keycloak_base_url, keycloak_realm, keycloak_client_id, keycloak_client_secret,
#   test_username, test_password, teams_webhook_url
kind: pipeline
type: docker
name: playwright

steps:
  - name: install
    image: mcr.microsoft.com/playwright:v1.49.0-jammy
    commands:
      - npm ci

  - name: api-tests
    image: mcr.microsoft.com/playwright:v1.49.0-jammy
    depends_on: [install]
    environment:
      BASE_URL:
        from_secret: e2e_base_url
      API_BASE_URL: https://jsonplaceholder.typicode.com
      KEYCLOAK_BASE_URL:
        from_secret: keycloak_base_url
      KEYCLOAK_REALM:
        from_secret: keycloak_realm
      KEYCLOAK_CLIENT_ID:
        from_secret: keycloak_client_id
      KEYCLOAK_CLIENT_SECRET:
        from_secret: keycloak_client_secret
      TEST_USERNAME:
        from_secret: test_username
      TEST_PASSWORD:
        from_secret: test_password
    commands:
      - npm run test:api

  - name: e2e-tests
    image: mcr.microsoft.com/playwright:v1.49.0-jammy
    depends_on: [install]
    environment:
      BASE_URL:
        from_secret: e2e_base_url
      KEYCLOAK_BASE_URL:
        from_secret: keycloak_base_url
      KEYCLOAK_REALM:
        from_secret: keycloak_realm
      KEYCLOAK_CLIENT_ID:
        from_secret: keycloak_client_id
      KEYCLOAK_CLIENT_SECRET:
        from_secret: keycloak_client_secret
      TEST_USERNAME:
        from_secret: test_username
      TEST_PASSWORD:
        from_secret: test_password
    commands:
      - npm run test:e2e

  - name: notify-teams
    image: mcr.microsoft.com/playwright:v1.49.0-jammy
    depends_on: [api-tests, e2e-tests]
    environment:
      TEAMS_WEBHOOK_URL:
        from_secret: teams_webhook_url
    commands:
      - npm run notify:teams -- reports/api-results.json reports/e2e-results.json
    when:
      status:
        - success
        - failure
